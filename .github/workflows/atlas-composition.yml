name: Verify primary atlas composition
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-composition.yml'
      - 'crates/genome-atlas/**'
      - 'crates/genome-cli/src/reference.rs'
      - 'crates/genome-data/src/twobit.rs'
      - 'datasets/genome-atlas/**'
      - 'research/atlas-composition/**'
      - 'research/context-reference/hg38-reference.json'
      - 'research/context-reference/ucsc-api-chrM-0-16569.json'
      - 'scripts/setup_reference.sh'
      - 'scripts/twobit_reference.py'
permissions:
  contents: read
jobs:
  composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HELIX_TOOLS_DIR: ${{ github.workspace }}/.ci-tools
    steps:
      - uses: actions/checkout@v4
      - name: Build the Rust CLI
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 build --release --locked -p genome-cli --bin helix
      - name: Verify the reference image
        run: bash scripts/setup_reference.sh
      - name: Count masked and unmasked bases on the primary chromosomes and across the full image
        run: |
          reference="$HELIX_TOOLS_DIR/reference/hg38.2bit"
          /usr/bin/time -f 'Mask-stratified atlas took %e s, max RSS %M KiB' \
            target/release/helix reference --file "$reference" --assembly GRCh38 \
            --expect-sha256 1f67aaa17a77b327738fe750ab37430a85dddf73c7d9189385ad1839259acec0 atlas-composition --by-soft-mask \
            > "$RUNNER_TEMP/soft-mask-summary.json"
          target/release/helix reference --file "$reference" --assembly GRCh38 \
            --expect-sha256 1f67aaa17a77b327738fe750ab37430a85dddf73c7d9189385ad1839259acec0 summary --by-soft-mask \
            > "$RUNNER_TEMP/whole-image-mask.json"
          python3 -m json.tool --indent 2 "$RUNNER_TEMP/soft-mask-summary.json" "$RUNNER_TEMP/soft-mask-summary-pretty.json"
          cat "$RUNNER_TEMP/soft-mask-summary-pretty.json"
      - name: Reconcile the whole twoBit with the UCSC assembly build log
        run: |
          python3 research/atlas-composition/verify_ucsc_mask.py \
            "$RUNNER_TEMP/whole-image-mask.json" "$RUNNER_TEMP/soft-mask-summary.json" \
            > "$RUNNER_TEMP/soft-mask-ucsc-control.json"
          cat "$RUNNER_TEMP/soft-mask-ucsc-control.json"
      - name: Replay the masked annotation counts from raw genePred and case-preserved DNA
        run: |
          python3 research/atlas-composition/verify_soft_mask.py \
            "$HELIX_TOOLS_DIR/reference/hg38.2bit" "$RUNNER_TEMP/soft-mask-summary.json" \
            > "$RUNNER_TEMP/soft-mask-source-check.json"
          cat "$RUNNER_TEMP/soft-mask-source-check.json"
      - name: Compute primary chromosome composition
        run: |
          /usr/bin/time -f 'Atlas composition took %e s, max RSS %M KiB' \
            target/release/helix reference --file "$HELIX_TOOLS_DIR/reference/hg38.2bit" \
            --assembly GRCh38 --expect-sha256 1f67aaa17a77b327738fe750ab37430a85dddf73c7d9189385ad1839259acec0 \
            atlas-composition --atlas datasets/genome-atlas > "$RUNNER_TEMP/atlas-composition.json"
      - name: Verify all nucleotide counts against raw genePred and an independent reference reader
        run: |
          python3 research/atlas-composition/verify.py \
            "$HELIX_TOOLS_DIR/reference/hg38.2bit" "$RUNNER_TEMP/atlas-composition.json" \
            > "$RUNNER_TEMP/atlas-source-check.json"
          cat "$RUNNER_TEMP/atlas-source-check.json"
          cmp research/atlas-composition/source-check.json "$RUNNER_TEMP/atlas-source-check.json"
      - name: Reconcile the mitochondrial partition with GenBank and retained UCSC sequence
        run: |
          python3 research/atlas-composition/mitochondrial_control.py --report "$RUNNER_TEMP/atlas-composition.json" \
            > "$RUNNER_TEMP/mitochondrial-control.json"
          cmp research/atlas-composition/mitochondrial-control.json "$RUNNER_TEMP/mitochondrial-control.json"
      - name: Compare the full report with the retained source-bound counts
        run: |
          python3 -m json.tool --indent 2 "$RUNNER_TEMP/atlas-composition.json" "$RUNNER_TEMP/atlas-composition-pretty.json"
          cmp research/atlas-composition/summary.json "$RUNNER_TEMP/atlas-composition-pretty.json"
      - name: Compare chromosome 21 against the accessioned NCBI genomic FASTA
        env:
          CHR21_FASTA_URL: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/GCF_000001405.40_GRCh38.p14_assembly_structure/Primary_Assembly/assembled_chromosomes/FASTA/chr21.fna.gz
        run: |
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 15 --max-time 120 \
            "$CHR21_FASTA_URL" --output "$RUNNER_TEMP/chr21.fna.gz"
          python3 research/atlas-composition/chr21_fasta_control.py "$RUNNER_TEMP/chr21.fna.gz" \
            "$HELIX_TOOLS_DIR/reference/hg38.2bit" "$RUNNER_TEMP/atlas-source-check.json" \
            > "$RUNNER_TEMP/chr21-fasta-control.json"
          cat "$RUNNER_TEMP/chr21-fasta-control.json"
          cmp research/atlas-composition/chr21-fasta-control.json "$RUNNER_TEMP/chr21-fasta-control.json"
