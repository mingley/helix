name: OL27 design source metadata
on:
  push:
    branches: [main]
    paths:
      - 'research/epistasis-replicate-metadata/inspect_design_reference.py'
      - '.github/workflows/ol27-design-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read publisher metadata for the sequence design
        run: python3 research/epistasis-replicate-metadata/inspect_design_reference.py
