name: OL27 design reference audit
on:
  push:
    branches: [main]
    paths:
      - 'research/epistasis-replicate-metadata/inspect_design_reference.py'
      - 'research/epistasis-replicate-metadata/audit_count_lineage.py'
      - 'research/epistasis-replicate-metadata/ol27-count-lineage.json'
      - 'research/epistasis-replicate-metadata/audit_design_crosswalk.py'
      - 'research/epistasis-replicate-metadata/ol27-source-metadata.json'
      - 'research/epistasis-replicate-metadata/ol27-crosswalk.json'
      - 'research/epistasis-replicate-metadata/test_design_crosswalk.py'
      - '.github/workflows/ol27-design-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify the shared plasmid sequencing inputs
        run: |
          python3 research/epistasis-replicate-metadata/audit_count_lineage.py > "$RUNNER_TEMP/ol27-count-lineage.json"
          cmp research/epistasis-replicate-metadata/ol27-count-lineage.json "$RUNNER_TEMP/ol27-count-lineage.json"
      - name: Read publisher metadata for the sequence design
        run: python3 research/epistasis-replicate-metadata/inspect_design_reference.py
      - name: Verify alias comparison rules
        run: python3 -m unittest discover -s research/epistasis-replicate-metadata -p test_design_crosswalk.py
      - name: Replay exact S18 sequence joins on the OL27 designs
        run: |
          python3 research/epistasis-replicate-metadata/audit_design_crosswalk.py --download > "$RUNNER_TEMP/ol27-crosswalk.json"
          cmp research/epistasis-replicate-metadata/ol27-crosswalk.json "$RUNNER_TEMP/ol27-crosswalk.json"
