name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust-and-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HELIX_TOOLS_DIR: ${{ github.workspace }}/.ci-tools
      HELIX_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned toolchains and Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            .ci-tools
            target
          key: helix-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'lean-toolchain') }}
      - run: bash scripts/setup.sh
      - run: bash scripts/check.sh
  independent-numerical-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HELIX_TOOLS_DIR: ${{ github.workspace }}/.ci-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/setup_research.sh
      - name: Independent synthetic controls and exact rank arithmetic
        shell: bash
        run: |
          source scripts/research-env.sh
          python3 research/independent-regulatory-replication/test_replication.py
          python3 research/independent-context-replication/test_context_replication.py
          python3 scripts/audit_context_source_arithmetic.py --self-test
          python3 scripts/analyze_rank_sensitivity.py --self-test
          python3 -m unittest discover -s research/independent-endpoint-recovery -p 'test_*.py'
          python3 -m unittest discover -s research/context-endpoint-recovery -p 'test_*.py'
          python3 -m unittest discover -s research/context-endpoint-recovery/source -p 'test_*.py'
          python3 research/context-endpoint-recovery/source/extract_members.py --self-test
          python3 -m unittest discover -s research/independent-context-activity-replication -p 'test_*.py'
          python3 -m unittest discover -s research/variant-transfer -p 'test_*.py'
          python3 -m unittest discover -s research/variant-transfer/prior-exposure-inventory -p 'test_*.py'
          python3 research/variant-transfer/source/map_design.py --self-test
          python3 scripts/audit_context_ess_cohort.py --self-test --primary-root research/results/context-endpoint-recovery-v1/primary
      # Full empirical reproduction is scripts/check_study.sh. Its known
      # secondary-rank failures remain exit 2 and are not masked as CI success.
