name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust-and-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HELIX_TOOLS_DIR: ${{ github.workspace }}/.ci-tools
      HELIX_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned toolchains and Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            .ci-tools
            target
          key: helix-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'lean-toolchain') }}
      - run: bash scripts/setup.sh
      - run: bash scripts/check.sh
